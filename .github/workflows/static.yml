name: Static bundle integrity
on:
  push:
    branches: [stlite-browser]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify all packaged files and application sources
        run: |
          python - <<'PYTHON'
          import hashlib,json
          from pathlib import Path
          hashes=json.loads(Path('bundle-files-sha256.json').read_text())
          for name,digest in hashes.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest, name
          app=json.loads(Path('app.json').read_text())
          manifest=json.loads(Path('manifest.json').read_text())
          assert app['requirements']==[]
          assert app['sharedWorker'] is False
          for name,digest in manifest['source_sha256'].items():
              assert hashlib.sha256(app['files'][name].encode()).hexdigest()==digest,name
          print(f"Verified {len(hashes)} static files and {len(app['files'])} app files")
          PYTHON
