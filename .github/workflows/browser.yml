name: Browser source checks
on:
  push:
    branches: [rollout/stlite-browser-navigation]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff==0.14.0
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q browser
      - run: ruff check browser tests/test_browser*.py
